<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="card-title text-center mb-4">Login</h3>
          <form (ngSubmit)="onLogin()">
            <div class="mb-3">
              <label for="userName" class="form-label">Usuario</label>
              <input [(ngModel)]="userName" name="userName" id="userName" 
                     class="form-control" placeholder="Ingresa tu usuario" required />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input [(ngModel)]="password" name="password" id="password" type="password" 
                     class="form-control" placeholder="Ingresa tu contraseña" required />
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
          </form>
          <p class="text-center mt-3 text-muted">{{ message }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
