<div class="container mt-4">
  <h2>Gestión de Items</h2>

    <button type="button" class="btn btn-link" data-bs-toggle="modal" data-bs-target="#registerItemModal"> Crear nuevo articulo </button>
    <button class="btn btn-primary mt-3" (click)="goHome()">Home</button>

  <!-- Modal for registration new users -->
 <div class="modal fade" id="registerItemModal" tabindex="-1" aria-labelledby="registerItemModalLabel" aria-hidden="true"> 
  <div class="modal-dialog"> 
    <div class="modal-content"> 
      <div class="modal-header"> 
        <h5 class="modal-title" id="registerItemModalLabel">Registrar nuevo articulo</h5>
         <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button> 
        </div> 
        <div class="modal-body"> 
          <form (ngSubmit)="registerItem()"> 
          <div class="mb-3"> 
            <label for="itemCode" class="form-label">Código</label> 
            <input type="text" id="itemCode" [(ngModel)]="newItem.itemCode" name="itemCode" class="form-control" autocomplete="off" required> 
          </div> 
           <div class="mb-3"> 
            <label for="itemDescription" class="form-label">Descripción</label>
             <input type="text" id="itemDescription" [(ngModel)]="newItem.itemDescription" name="itemDescription" class="form-control" autocomplete="off" required> 
          </div> 
          <div class="mb-3"> 
            <label for="itemPrice" class="form-label">Precio</label> 
            <input type="text" id="itemPrice" [(ngModel)]="newItem.itemPrice" name="itemPrice" class="form-control" autocomplete="off" required>
           </div> 
          <div class="mb-3"> 
            <label for="itemStock" class="form-label">Stock</label> 
            <input type="text" id="itemStock" [(ngModel)]="newItem.itemStock" name="itemStock" class="form-control" autocomplete="off" required>
           </div> 
           <div class="mb-3"> 
              <input type="file" name="itemfile" [(ngModel)]="newItem.itemfile" /> 
           </div> 
          <button type="submit" class="btn btn-primary">Registrar</button> 
        </form> 
      </div> 
    </div> 
  </div> 
</div>
</div>
