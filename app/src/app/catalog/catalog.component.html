<div class="container mt-4">
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let item of itemList">
      <div class="card h-100 shadow-sm">
        <img [src]="'data:image/png;base64,' + item.itemImg" class="card-img-top" alt="{{item.itemCode}}">
        <div class="card-body">
          <h5 class="card-title">{{item.itemCode}}</h5>
          <p class="card-text">{{item.itemDescription}}</p>
        </div>
        <div class="card-footer text-muted d-flex justify-content-between align-items-center">
          <span class="fw-bold">${{item.itemPrice}}</span>
          <span [ngClass]="{'text-success': item.itemStock > 0, 'text-danger': item.itemStock === 0}"> Queda(n): {{item.itemStock}} </span>
          <button class="btn btn-primary btn-sm" [disabled]="item.itemStock === 0"> {{ item.itemStock > 0 ? 'Agregar al carrito' : 'Agotado' }} </button>
        </div>
      </div>
    </div>
  </div>
</div>
