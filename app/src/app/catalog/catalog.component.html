<div class="container mt-4">
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let item of itemList">
      <div class="card h-100 shadow-sm">
        <img [src]="'data:image/png;base64,' + item.itemImg" class="card-img-top" alt="{{item.itemCode}}">
        <div class="card-body">
          <h5 class="card-title">{{item.itemCode}}</h5>
          <p class="card-text">{{item.itemDescription}}</p>
          <p class="card-text">
            <span [ngClass]="{'text-success': item.itemStock > 0, 'text-danger': item.itemStock === 0}"> 
                Queda(n): {{item.itemStock}} 
            </span>
          </p>
        </div>
        <div class="card-footer text-muted d-flex justify-content-between align-items-center">
          <span class="fw-bold">{{item.itemPrice | currency:'MXN':'symbol'}}</span>
          <div class="btn-group btn-group-sm addgroup-btn" *ngIf="item.itemAmount && item.itemAmount > 0" >
              <button class="btn btn-secondary btn-sm" type="button" (click)="removeItem(item)">-</button>
              <span  type="text" class="form-control  form-control-sm text-center">{{item.itemAmount}}</span>
              <button class="btn btn-primary btn-sm" type="button" (click)="addItem(item)">+</button>
          </div>
          <button *ngIf="!item.itemAmount || item.itemAmount === 0" class="btn btn-primary btn-sm" [disabled]="item.itemStock === 0" (click)="addItem(item)"> {{ item.itemStock > 0 ? 'Agregar al carrito' : 'Agotado' }} </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="loading" class="overlay"> 
    <div class="spinner-border text-light" role="status"> 
        <span class="visually-hidden">Cargando...</span> 
    </div>
     <p class="mt-3 text-white">Por favor espere...</p>
</div>
